name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Linux
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          # Exact, not "22": the Windows client is node.exe with a blob injected,
          # so a patch bump changes the binary the SEA fuse has to match.
          node-version: "22.23.5"
          cache: npm
          cache-dependency-path: cloud/package-lock.json

      - name: Check version consistency
        # A release rewrites five version strings across four files. A partial
        # rewrite ships a cloud Worker reporting a different version than the
        # app it belongs to, which is what 2.33.0 did.
        run: node scripts/check-versions.mjs

      - name: Check the repository is not ahead of the latest release
        # v2.38.7 shipped and work kept landing: the repository reported a
        # version newer than the only download, so reports described code
        # nobody could install. A test-only bump can be allowed, with a reason
        # and an expiry date, in scripts/release-drift-allowlist.json.
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/check-release-drift.mjs

      - name: Check no secret is passed as an argument
        # Arguments are readable from ps; 2.35.21 moved the release token off
        # curl's command line. This keeps it from creeping back.
        run: node scripts/check-secrets.mjs

      - name: Install cloud dependencies
        working-directory: cloud
        run: npm ci

      - name: Rebuild the single file
        run: node build/bundle.mjs

      - name: Build the cloud Worker
        working-directory: cloud
        run: node build.mjs

      - name: Unit tests
        run: node --test lib/*.test.mjs

      - name: CLI and HTTP tests
        run: node test/cli.mjs

      - name: Simulation
        run: node test/simulate.mjs

      - name: Single-file simulation
        env:
          APP_PATH: freeway.mjs
        run: node test/simulate.mjs

      - name: Cloud tests
        # Node 22 still gates node:sqlite behind this flag; the test harness uses it.
        env:
          NODE_OPTIONS: --experimental-sqlite
        run: node cloud/test.mjs

      - name: Browser cooldown regression
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: npm run test:cooldown

      - name: Browser Chatty regression
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: npm run test:chatty

      - name: Browser Chatty contextual tip regression
        # A debugging draft must earn a debugging tip, and a keystroke must hold
        # the next one back until the typing pause passes.
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: npm run test:chatty-context

      - name: Browser cloud tour regression
        # The cloud page has fewer controls than the desktop one (no starter row,
        # no Quit at phone width). Its tour must walk the stops it can show,
        # numbered 1..N, with the ring on each stop's own control, and finish.
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: npm run test:cloud-tour

      - name: Browser desktop 390 regression
        # The desktop page at phone size: renders, streams a turn, Stop cancels it.
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: npm run test:desktop-390

      - name: Browser store warning regression
        # A damaged threads.json and threads-archive.json must be explained in the
        # sidebar, and Dismiss must clear the banner for good. The store and CLI
        # tests cover the payload; this covers the banner the user reads.
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: npm run test:store-warning

  windows:
    name: Windows client
    # The Windows ZIP is one Freeway.exe with Node inside and nothing else, and
    # only the tag workflow ever built it: a binary that would not start could sit
    # on main until the next release. Build the same file here and launch it.
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          # Exact, not "22": the Windows client is node.exe with a blob injected,
          # so a patch bump changes the binary the SEA fuse has to match.
          node-version: "22.23.5"

      - name: Rebuild the single file
        run: node build/bundle.mjs

      - name: Launch start.cmd without Freeway.exe
        # A source checkout has no executable, so the launcher has to fall back to
        # `node app.mjs`. That branch only runs before the build below creates
        # Freeway.exe, so this step stays ahead of it.
        shell: pwsh
        run: node scripts/smoke-windows-client.mjs -- cmd.exe /c start.cmd

      - name: Launch start.cmd with no runtime at all
        # The launcher's last branch: no Freeway.exe and no node on PATH. It has to
        # explain that and exit 1, not exit quietly or sit waiting; < nul answers its
        # pause so a regression cannot hang the job. PATH is narrowed to the system
        # directories so nothing can resolve a node from the tool cache.
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $false
          $env:PATH = "$env:SystemRoot\system32;$env:SystemRoot"
          $found = cmd.exe /c 'where node' 2>&1
          if ($LASTEXITCODE -eq 0) { throw "node still resolves to $found" }
          $output = (cmd.exe /c 'start.cmd < nul' 2>&1) -join "`n"
          $code = $LASTEXITCODE
          Write-Host $output
          if ($code -ne 1) { throw "start.cmd exited $code with neither Freeway.exe nor node" }
          if ($output -notmatch 'Neither Freeway\.exe nor Node\.js was found') {
            throw "start.cmd did not say what is missing"
          }
          if ($output -notmatch 'nodejs\.org') { throw "start.cmd did not say where to get node" }
          # start.cmd exits 1 on purpose here, and Actions ends the step with
          # `exit $LASTEXITCODE`; without this the correct behaviour fails the job.
          $LASTEXITCODE = 0

      - name: Build the Windows client
        # The release workflow runs this same script, so the packaged binary and
        # the one CI launches cannot drift apart.
        shell: pwsh
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/build-windows-client.ps1

      - name: Launch the client and read /api/config
        # Runs what users download: Freeway.exe has to report the package version
        # and serve the app page, not just exist.
        run: node scripts/smoke-windows-client.mjs

      - name: Package the Windows ZIP
        # The release uploads this exact archive, so build it here too.
        shell: pwsh
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/pack-windows-client.ps1

      - name: Unzip the ZIP and launch start.cmd
        # A person unzips the download and double-clicks start.cmd, so the launcher
        # has to find the binary next to it and serve. The exe test above never
        # touches start.cmd or the archive.
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $zip = "Freeway-$version-windows.zip"
          $dest = Join-Path $env:RUNNER_TEMP "freeway-unzipped"
          if (Test-Path $dest) { Remove-Item -Recurse -Force $dest }
          Expand-Archive -Path $zip -DestinationPath $dest
          Get-ChildItem $dest | Select-Object Name, Length
          $info = Get-Content (Join-Path $dest "build-info.txt")
          $info | ForEach-Object { Write-Host $_ }
          if (-not ($info -contains "version: $version")) {
            throw "the ZIP's build-info.txt does not describe $version"
          }
          if (-not ($info -match '^commit: [0-9a-f]{7,}$')) { throw "the ZIP does not name its commit" }
          $launcher = Join-Path $dest "start.cmd"
          if (-not (Test-Path $launcher)) { throw "the ZIP does not contain start.cmd" }
          node scripts/smoke-windows-client.mjs -- cmd.exe /c $launcher

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-client-zip
          # The exact archive this job unpacked and launched, so a build that only
          # fails on a real desktop can be downloaded without rebuilding it.
          path: Freeway-*-windows.zip
