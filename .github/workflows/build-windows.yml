name: Release assets

# Every release carries three assets: the source ZIP built from the tag, the
# Windows client built and smoke-tested on a real Windows machine, and
# SHA256SUMS covering both. Building them here means a release needs no local
# packaging or checksum step at all — pushing the tag is the whole publish.
#
# Node SEA injects a blob into node.exe, so the Windows result can only be
# produced (and smoke-tested) on Windows. The source ZIP stays on Linux because
# it must keep the exact `zip` invocation and exclusions release.sh uses.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  source:
    name: Source ZIP
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Build the source ZIP
        # Same command and exclusions as release.sh: runtime state, secrets,
        # build output and the cloud edition (served separately) never ship.
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          rm -f "$RUNNER_TEMP/Freeway-$version.zip"
          cd ..
          zip -r -q "$RUNNER_TEMP/Freeway-$version.zip" freeway \
            -x 'freeway/cloud/*' 'freeway/node_modules/*' 'freeway/dist/*' 'freeway/.git/*' '*/.DS_Store' \
               'freeway/.env*' 'freeway/config.json' 'freeway/threads.json' 'freeway/secrets.json' \
               'freeway/*.tmp' 'freeway/.tmp/*' 'freeway/*.log'
          ls -l "$RUNNER_TEMP/Freeway-$version.zip"
          unzip -l "$RUNNER_TEMP/Freeway-$version.zip" | tail -3

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: source-zip
          path: ${{ runner.temp }}/Freeway-*.zip

  windows:
    name: Windows client
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Rebuild the single file
        run: node build/bundle.mjs

      - name: Unit tests
        # PowerShell does not expand lib/*.test.mjs; pass the discovered files.
        run: node --test (Get-ChildItem lib -Filter *.test.mjs).FullName

      - name: CLI and single-file tests
        run: node test/cli.mjs

      - name: Build the SEA blob
        run: node --experimental-sea-config sea-config.json

      - name: Inject the blob into node.exe
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $exe = "Freeway.exe"
          Copy-Item (Get-Command node).Source $exe
          npx --yes postject $exe NODE_SEA_BLOB sea-prep.blob `
            --sentinel-fuse NODE_SEA_FUSE_fce680ab2cc467b6e072b8b5df1996b2
          # Appending the blob invalidates the Authenticode signature that node.exe
          # ships with; Windows refuses to start a binary whose signature is broken,
          # so the signature has to be removed before it will run.
          $signtool = Get-Command signtool.exe -ErrorAction SilentlyContinue
          if ($signtool) {
            & $signtool.Source remove /s $exe
          } else {
            Write-Host "signtool not found; leaving the signature untouched"
          }

      - name: Smoke-test the executable
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          .\Freeway.exe --version
          if ($LASTEXITCODE -ne 0) { throw "the executable did not report a version" }

      - name: Launch the executable and serve the page
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $port = 31234
          $config = Join-Path $env:RUNNER_TEMP "freeway-smoke-config"
          $out = Join-Path $env:RUNNER_TEMP "freeway-smoke.out.log"
          $err = Join-Path $env:RUNNER_TEMP "freeway-smoke.err.log"
          $env:NO_OPEN = "1"
          $exe = Start-Process -FilePath ".\Freeway.exe" `
            -ArgumentList "--port", $port, "--host", "127.0.0.1", "--config", $config `
            -PassThru -RedirectStandardOutput $out -RedirectStandardError $err
          try {
            $served = $null
            for ($i = 0; $i -lt 60; $i++) {
              Start-Sleep -Milliseconds 250
              if (-not (Get-Process -Id $exe.Id -ErrorAction SilentlyContinue)) { break }
              try {
                $served = Invoke-RestMethod -Uri "http://127.0.0.1:$port/api/config" -TimeoutSec 2
                break
              } catch {
                $served = $null
              }
            }
            if (-not $served) {
              Get-Content $out -ErrorAction SilentlyContinue
              Get-Content $err -ErrorAction SilentlyContinue
              throw "Freeway.exe did not answer /api/config"
            }
            if ($served.version -ne $version) {
              throw "Freeway.exe reported $($served.version), expected $version"
            }
            $page = Invoke-WebRequest -Uri "http://127.0.0.1:$port/" -TimeoutSec 10 -UseBasicParsing
            if ($page.StatusCode -ne 200 -or $page.Content -notmatch "Freeway") {
              throw "Freeway.exe did not serve the page"
            }
            Write-Host "Freeway.exe served $($served.version) and the page on Windows"
          } finally {
            if (Get-Process -Id $exe.Id -ErrorAction SilentlyContinue) {
              Stop-Process -Id $exe.Id -Force
            }
          }

      - name: Package
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $zip = "Freeway-$version-windows.zip"
          Compress-Archive -Path Freeway.exe, README.md, VERSIONS.md, start.cmd `
            -DestinationPath $zip -Force
          "ZIP=$zip" | Out-File -FilePath $env:GITHUB_ENV -Append

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-client
          path: ${{ env.ZIP }}

  publish:
    name: Release
    # Both ZIPs must exist before hashing: SHA256SUMS that lists only one asset
    # makes verify-release.sh fail, so the manifest is written once, complete.
    needs: [source, windows]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Dispatching the verification workflow is an Actions write.
      actions: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: source-zip
          path: assets

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: windows-client
          path: assets

      - name: Write and check SHA256SUMS
        run: |
          set -euo pipefail
          cd assets
          ls -l
          sha256sum Freeway-*.zip | sort -k2 > SHA256SUMS
          cat SHA256SUMS
          sha256sum -c SHA256SUMS

      - name: Take the release notes from VERSIONS.md
        # The tagged commit owns its own notes, so the body cannot drift from the
        # changelog. A tag without a section still publishes, with a plain title.
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          {
            printf '# Freeway %s\n\n' "$version"
            awk -v v="$version" '
              $0 ~ "^## " v "( |$)" { found = 1; next }
              found && /^## / { exit }
              found { print }
            ' VERSIONS.md
          } > "$RUNNER_TEMP/notes.md"
          if [ "$(wc -c < "$RUNNER_TEMP/notes.md")" -lt 30 ]; then
            printf '# Freeway %s\n\nSee VERSIONS.md.\n' "$version" > "$RUNNER_TEMP/notes.md"
          fi
          cat "$RUNNER_TEMP/notes.md"

      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: assets/*
          body_path: ${{ runner.temp }}/notes.md
          fail_on_unmatched_files: true
          make_latest: true

      - name: Trigger the release verification
        # Creating the release above used GITHUB_TOKEN, so GitHub never starts
        # the Verify release workflow's release:published trigger. Dispatch it
        # explicitly and fail if no run appears: an unverified release is the
        # state this job exists to prevent.
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          gh workflow run verify-release.yml --repo "$GITHUB_REPOSITORY" --ref "$TAG" -f version="$version"
          for attempt in $(seq 1 24); do
            sleep 5
            started="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow verify-release.yml --limit 20 \
              --json event,headSha \
              --jq "[.[] | select(.event == \"workflow_dispatch\" and .headSha == \"$GITHUB_SHA\")] | length")"
            if [ "$started" -gt 0 ]; then
              echo "Verify release started for $TAG."
              exit 0
            fi
          done
          echo "The Verify release workflow never started for $TAG." >&2
          exit 1
