name: Windows client

# Builds Freeway.exe from the single-file bundle on a real Windows machine.
# Node SEA injects a blob into node.exe, so the result can only be produced (and
# smoke-tested) on Windows — which is why this runs here and not in the local app.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Rebuild the single file
        run: node build/bundle.mjs

      - name: Unit tests
        # PowerShell does not expand lib/*.test.mjs; pass the discovered files.
        run: node --test (Get-ChildItem lib -Filter *.test.mjs).FullName

      - name: CLI and single-file tests
        run: node test/cli.mjs

      - name: Build the SEA blob
        run: node --experimental-sea-config sea-config.json

      - name: Inject the blob into node.exe
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $exe = "Freeway.exe"
          Copy-Item (Get-Command node).Source $exe
          npx --yes postject $exe NODE_SEA_BLOB sea-prep.blob `
            --sentinel-fuse NODE_SEA_FUSE_fce680ab2cc467b6e072b8b5df1996b2
          # Appending the blob invalidates the Authenticode signature that node.exe
          # ships with; Windows refuses to start a binary whose signature is broken,
          # so the signature has to be removed before it will run.
          $signtool = Get-Command signtool.exe -ErrorAction SilentlyContinue
          if ($signtool) {
            & $signtool.Source remove /s $exe
          } else {
            Write-Host "signtool not found; leaving the signature untouched"
          }

      - name: Smoke-test the executable
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          .\Freeway.exe --version
          if ($LASTEXITCODE -ne 0) { throw "the executable did not report a version" }

      - name: Launch the executable and serve the page
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $port = 31234
          $config = Join-Path $env:RUNNER_TEMP "freeway-smoke-config"
          $out = Join-Path $env:RUNNER_TEMP "freeway-smoke.out.log"
          $err = Join-Path $env:RUNNER_TEMP "freeway-smoke.err.log"
          $env:NO_OPEN = "1"
          $exe = Start-Process -FilePath ".\Freeway.exe" `
            -ArgumentList "--port", $port, "--host", "127.0.0.1", "--config", $config `
            -PassThru -RedirectStandardOutput $out -RedirectStandardError $err
          try {
            $served = $null
            for ($i = 0; $i -lt 60; $i++) {
              Start-Sleep -Milliseconds 250
              if (-not (Get-Process -Id $exe.Id -ErrorAction SilentlyContinue)) { break }
              try {
                $served = Invoke-RestMethod -Uri "http://127.0.0.1:$port/api/config" -TimeoutSec 2
                break
              } catch {
                $served = $null
              }
            }
            if (-not $served) {
              Get-Content $out -ErrorAction SilentlyContinue
              Get-Content $err -ErrorAction SilentlyContinue
              throw "Freeway.exe did not answer /api/config"
            }
            if ($served.version -ne $version) {
              throw "Freeway.exe reported $($served.version), expected $version"
            }
            $page = Invoke-WebRequest -Uri "http://127.0.0.1:$port/" -TimeoutSec 10 -UseBasicParsing
            if ($page.StatusCode -ne 200 -or $page.Content -notmatch "Freeway") {
              throw "Freeway.exe did not serve the page"
            }
            Write-Host "Freeway.exe served $($served.version) and the page on Windows"
          } finally {
            if (Get-Process -Id $exe.Id -ErrorAction SilentlyContinue) {
              Stop-Process -Id $exe.Id -Force
            }
          }

      - name: Package
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $zip = "Freeway-$version-windows.zip"
          Compress-Archive -Path Freeway.exe, README.md, VERSIONS.md, start.cmd `
            -DestinationPath $zip -Force
          "ZIP=$zip" | Out-File -FilePath $env:GITHUB_ENV -Append

      - uses: actions/upload-artifact@v4
        with:
          name: windows-client
          path: ${{ env.ZIP }}

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ZIP }}
