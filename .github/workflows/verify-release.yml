name: Verify release

# Verify every published release against its attached SHA256SUMS. The Windows
# job attaches its ZIP from build-windows.yml, so wait for all assets before
# treating a publish that races that build as a checksum failure.
#
# A release created with GITHUB_TOKEN never emits release:published runs, which
# is why the old trigger silently did nothing after the assets workflow started
# creating releases. build-windows.yml therefore dispatches this workflow once
# the assets are uploaded; workflow_dispatch is the one event GitHub still
# starts for a run that used GITHUB_TOKEN.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: Release to verify, with or without the v prefix
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify:
    name: Download and verify assets
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Resolve the tag
        # The release event carries a tag; a dispatch carries only a version.
        env:
          RAW: ${{ github.event.release.tag_name || inputs.version }}
        run: |
          set -euo pipefail
          tag="$RAW"
          case "$tag" in
            v*) ;;
            *) tag="v$tag" ;;
          esac
          echo "TAG=$tag" >> "$GITHUB_ENV"
          echo "Verifying $tag"

      - name: Wait for release assets
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          required=(
            "Freeway-${version}.zip"
            "Freeway-${version}-windows.zip"
            "SHA256SUMS"
          )
          for attempt in $(seq 1 60); do
            assets="$(gh release view "$TAG" --repo "$REPO" --json assets --jq '.assets[].name' 2>/dev/null || true)"
            missing=0
            for file in "${required[@]}"; do
              if ! grep -Fxq "$file" <<<"$assets"; then
                missing=1
              fi
            done
            if [ "$missing" -eq 0 ]; then
              echo "All release assets are present (check $attempt)."
              exit 0
            fi
            sleep 15
          done

          echo "Timed out waiting for $TAG assets: ${required[*]}" >&2
          printf 'Assets currently on the release:\n%s\n' "$assets" >&2
          exit 1

      - name: Verify published checksums
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: ./verify-release.sh "${TAG#v}" --repo "$REPO"
