<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Hello World — made in the workspace</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: radial-gradient(900px 460px at 50% -10%, #141414 0%, #000 65%);
        color: #f3f3f3;
        font: 16px/1.6 "Segoe UI", system-ui, -apple-system, sans-serif;
        text-align: center;
        padding: 24px;
      }
      .card {
        border: 1px solid #242424;
        background: #0b0b0b;
        border-radius: 16px;
        padding: clamp(24px, 5vw, 48px) clamp(22px, 6vw, 64px);
        max-width: 620px;
      }
      h1 { margin: 0 0 10px; font-size: clamp(30px, 6vw, 52px); letter-spacing: -.5px; color: #fff; }
      p { margin: 0 0 8px; color: #9a9a9a; }
      .tag {
        display: inline-block; margin-bottom: 18px; font-size: 11px; letter-spacing: .12em;
        text-transform: uppercase; color: #6e6e6e; border: 1px solid #242424; border-radius: 999px;
        padding: 3px 10px; font-family: "Cascadia Code", ui-monospace, Consolas, monospace;
      }
      a { color: #f3f3f3; }
      .files { margin-top: 20px; font-size: 13px; }
    </style>
  </head>
  <body>
    <main class="card">
      <span class="tag">workspace · hello</span>
      <h1>Hello World</h1>
      <p>This file exists because a chat wrote it, not because a template shipped it.</p>
      <p class="files"><a href="./">← back to the file snapshot</a></p>
    </main>
  </body>
</html>
