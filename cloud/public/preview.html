<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Preview</title>
    <style>
      :root {
        color-scheme: light dark;
        font: 14px/1.55 ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: #fff;
      }
      body {
        color: #14181d;
      }
      #frame {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        border: 0;
        background: #fff;
      }
      .state {
        min-height: 100%;
        display: grid;
        place-items: center;
        box-sizing: border-box;
        padding: 24px;
        background: #f5f7fa;
      }
      .card {
        width: min(560px, 100%);
        border: 1px solid #d7dde6;
        border-radius: 12px;
        padding: 20px 22px;
        background: #fff;
        box-shadow: 0 10px 30px rgb(15 23 42 / 8%);
      }
      .card h1 {
        margin: 0 0 6px;
        font-size: 17px;
        line-height: 1.3;
      }
      .card p {
        margin: 0 0 10px;
        color: #4d5866;
      }
      .card p:last-child {
        margin-bottom: 0;
      }
      .card a {
        color: #1f5fbf;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background: #14181d;
          color: #edf0f3;
        }
        #frame {
          background: #14181d;
        }
        .state {
          background: #101419;
        }
        .card {
          border-color: #2c343f;
          background: #191d22;
          box-shadow: none;
        }
        .card p {
          color: #aab3c0;
        }
        .card a {
          color: #8ab4ff;
        }
      }
    </style>
  </head>
  <body>
    <main class="state" id="state">
      <section class="card" role="status" aria-live="polite">
        <h1 id="stateTitle">Opening preview…</h1>
        <p id="stateText">Reading the saved page from this browser.</p>
        <p id="stateActions" hidden><a id="appLink" href="./">Open Freeway</a></p>
      </section>
    </main>
    <iframe
      id="frame"
      title="Preview"
      sandbox="allow-scripts allow-forms allow-popups"
      referrerpolicy="no-referrer"
      hidden
    ></iframe>
    <script src="./preview-core.js"></script>
    <script>
      (function () {
        'use strict';
        var panel = document.getElementById('state');
        var heading = document.getElementById('stateTitle');
        var detail = document.getElementById('stateText');
        var actions = document.getElementById('stateActions');
        var frame = document.getElementById('frame');

        function fail(title, message) {
          document.title = title + ' — Preview';
          heading.textContent = title;
          detail.textContent = message;
          actions.hidden = false;
          panel.hidden = false;
        }

        function show(html, file) {
          var label = file.split('/').pop() || 'Preview';
          document.title = label + ' — Preview';
          frame.title = label;
          frame.addEventListener(
            'load',
            function () {
              panel.hidden = true;
            },
            { once: true },
          );
          frame.srcdoc = html;
          frame.hidden = false;
        }

        function openDb() {
          return new Promise(function (resolve, reject) {
            var request = indexedDB.open('freeway-files', 2);
            request.onupgradeneeded = function () {
              if (!request.result.objectStoreNames.contains('files')) {
                request.result.createObjectStore('files');
              }
            };
            request.onsuccess = function () {
              resolve(request.result);
            };
            request.onerror = function () {
              reject(request.error);
            };
          });
        }

        function readStored(db, key) {
          return new Promise(function (resolve, reject) {
            var request = db.transaction('files', 'readonly').objectStore('files').get(key);
            request.onsuccess = function () {
              resolve(request.result == null ? '' : String(request.result));
            };
            request.onerror = function () {
              reject(request.error);
            };
          });
        }

        function readBrowserFiles(chat) {
          try {
            var all = JSON.parse(localStorage.getItem('orc.files.v2') || 'null');
            if (!all || typeof all !== 'object' || Array.isArray(all)) return null;
            var map = all[chat];
            return map && typeof map === 'object' && !Array.isArray(map) ? map : null;
          } catch (error) {
            return null;
          }
        }

        async function readWorkspace(chat) {
          if ('indexedDB' in window) {
            var db = null;
            try {
              db = await openDb();
              var raw = await readStored(db, 'workspace:' + chat);
              var map = raw ? JSON.parse(raw) : null;
              if (map && typeof map === 'object' && !Array.isArray(map)) return map;
            } catch (error) {
              /* fall through to the state-only copy */
            } finally {
              if (db && typeof db.close === 'function') db.close();
            }
          }
          return readBrowserFiles(chat);
        }

        async function load(chat, file, attempt) {
          var map = null;
          try {
            map = await readWorkspace(chat);
          } catch (error) {
            map = null;
          }
          if (!map || typeof map[file] !== 'string') {
            // A write is saved on a short debounce; a link opened immediately
            // after the AI writes can arrive just before the record lands.
            if (attempt < 4) {
              await new Promise(function (resolve) {
                setTimeout(resolve, 200);
              });
              return load(chat, file, attempt + 1);
            }
            fail(
              'Preview not found',
              'This page points at ' +
                file +
                ', which is not saved in this browser. Browser previews work only where the chat and its files are saved.',
            );
            return;
          }

          try {
            var body = map[file];
            var html;
            if (/\.(md|markdown)$/i.test(file)) {
              html = FreewayPreview.renderMarkdown(body, { title: file });
            } else if (/\.(html?|svg)$/i.test(file)) {
              var packageJson = null;
              try {
                packageJson = JSON.parse(map['package.json'] || 'null');
              } catch (error) {
                packageJson = null;
              }
              var result = await FreewayPreview.bundleStatic({
                entry: file,
                entryContent: body,
                readFile: function (path) {
                  return map[path];
                },
                packageJson: packageJson,
              });
              html = result.html;
            } else {
              fail('No preview for this file', 'Only HTML, SVG and Markdown files can open in the preview.');
              return;
            }
            show(html, file);
          } catch (error) {
            fail('Preview unavailable', (error && error.message) || 'The page could not be built.');
          }
        }

        var params = new URLSearchParams(location.search);
        var file = String(params.get('file') || '')
          .trim()
          .replace(/^\/+/, '');
        var chat = String(params.get('chat') || 'draft').trim() || 'draft';
        if (!file) {
          fail('No preview selected', 'Open a page from Freeway to see it full screen.');
        } else {
          load(chat, file, 0);
        }
      })();
    </script>
  </body>
</html>
